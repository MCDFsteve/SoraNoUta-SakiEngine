name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    uses: ./.github/workflows/windows-build.yml
    with:
      flutter_version: '3.44.0'
      working_directory: '.'
      architecture: x64
    secrets: inherit

  build-macos:
    name: Build macOS
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    uses: ./.github/workflows/macos-build.yml
    with:
      flutter_version: '3.44.0'
      working_directory: '.'
      create_dmg: true
    secrets: inherit

  build-linux:
    name: Build Linux
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    uses: ./.github/workflows/linux-build.yml
    with:
      flutter_version: '3.44.0'
      working_directory: '.'
      architecture: amd64
    secrets: inherit
