name: soranouta_app
description: "SoraNoUta Flutter game project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  sakiengine:
    path: ../../Engine
  soranouta_project:
    path: ./ProjectCode

dependency_overrides:
  flutter_steamworks:
    path: ../../third_party/flutter_steamworks_hotfix
  media_kit:
    path: ../../third_party/media_kit_hotfix
  media_kit_video:
    path: ../../third_party/media_kit_video_hotfix
  media_kit_libs_android_video:
    path: ../../third_party/media_kit_libs_android_video_hotfix
  media_kit_libs_ios_video:
    path: ../../third_party/media_kit_libs_ios_video_hotfix
  media_kit_libs_macos_video:
    path: ../../third_party/media_kit_libs_macos_video_hotfix
  media_kit_libs_windows_video:
    path: ../../third_party/media_kit_libs_windows_video_hotfix
  media_kit_libs_linux:
    path: ../../third_party/media_kit_libs_linux_hotfix

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - default_game.txt
    - .saki_cache/game.sakipak
  fonts:
    - family: SourceHanSansCN
      fonts:
        - asset: Assets/fonts/SourceHanSansCN-Bold.ttf
    - family: ChillJinshuSongPro_Soft
      fonts:
        - asset: Assets/fonts/ChillJinshuSongPro_Soft.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "icon.png"
  macos:
    generate: true
    image_path: "icon.png"
